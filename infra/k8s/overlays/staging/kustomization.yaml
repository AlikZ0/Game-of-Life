# ============================================================================
#  Staging overlay — smaller footprint, staging host + image tag.
#  Apply:  kubectl apply -k infra/k8s/overlays/staging
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lifequest-staging

resources:
  - ../../base

# Prefix names so staging can coexist with prod in the same cluster if needed.
namePrefix: ""

# Pin the deployed image tag (CI replaces this, e.g. sha-<gitsha>).
images:
  - name: ghcr.io/lifequest/api
    newTag: staging

# Staging-specific config overrides (merged into the base ConfigMap).
configMapGenerator:
  - name: lifequest-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - CORS_ORIGINS=https://staging.lifequest.app
      - LOG_LEVEL=debug

patches:
  # Single API replica in staging.
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # HPA range for staging.
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # Staging host + TLS secret name on the Ingress.
  - target:
      kind: Ingress
      name: lifequest
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.lifequest.app
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.lifequest.app
