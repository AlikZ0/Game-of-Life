# ============================================================================
#  Life Quest — Nginx reverse proxy (local / dev container)
#  Fronts the NestJS API on :80 and proxies:
#    /api        → REST API      (path prefix /api/v1)
#    /docs       → Swagger UI
#    /socket.io  → WebSocket (Socket.IO) with connection upgrade
#  In production, ingress-nginx (see k8s/base/ingress.yaml) plays this role.
# ============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;              # don't leak nginx version
    client_max_body_size 10m;         # allow avatar / attachment uploads

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    # ── Upstream API ────────────────────────────────────────────────────────
    # `api` is the compose service name; 3000 is the NestJS port.
    upstream lifequest_api {
        server api:3000;
        keepalive 32;
    }

    # ── WebSocket upgrade map ───────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header X-XSS-Protection        "1; mode=block"    always;
        add_header Referrer-Policy         "no-referrer-when-downgrade" always;
        # HSTS is set at the TLS terminator (ingress) in production.

        # ── Common proxy settings ───────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 5s;

        # ── WebSocket (Socket.IO) ───────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://lifequest_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;   # long-lived realtime connections
        }

        # ── REST API ────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://lifequest_api;
        }

        # ── Swagger docs ────────────────────────────────────────────────────
        location /docs {
            proxy_pass http://lifequest_api;
        }

        # ── Proxy-level health (returns the API health) ─────────────────────
        location = /healthz {
            access_log off;
            proxy_pass http://lifequest_api/api/v1/health;
        }

        # Everything else 404s at the proxy.
        location / {
            return 404;
        }
    }
}
