# ============================================================================
#  EXAMPLE Secret — DOCUMENTATION ONLY. DO NOT APPLY WITH REAL VALUES.
#
#  Real secrets must NEVER be committed in plaintext. Use one of:
#    - Sealed Secrets (bitnami-labs/sealed-secrets): commit a SealedSecret that
#      the controller decrypts in-cluster.
#    - SOPS + age/KMS: encrypt this file, decrypt in CI before `kubectl apply`.
#    - External Secrets Operator: sync from AWS Secrets Manager / Vault / GCP SM.
#
#  This file exists so operators know the exact key names the app expects.
#  Copy to `secret.yaml`, fill values, seal/encrypt, then remove the plaintext.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lifequest-secrets
  labels:
    app.kubernetes.io/part-of: lifequest
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────────────────────────────
  # In-cluster StatefulSet example. For prod prefer managed RDS/CloudSQL:
  #   postgresql://USER:PASSWORD@your-rds-host:5432/lifequest?schema=public&sslmode=require
  DATABASE_URL: "postgresql://lifequest:REPLACE_ME@postgres:5432/lifequest?schema=public"

  # Credentials consumed by the postgres StatefulSet (in-cluster DB only).
  POSTGRES_USER: "lifequest"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "lifequest"

  # ── Auth (generate with `openssl rand -hex 32`) ───────────────────────────
  JWT_ACCESS_SECRET: "REPLACE_ME_ACCESS_32B_HEX"
  JWT_REFRESH_SECRET: "REPLACE_ME_REFRESH_32B_HEX"

  # ── Stripe (optional) ─────────────────────────────────────────────────────
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # ── Firebase Admin (optional; private key is multi-line, keep the \n) ─────
  FIREBASE_PROJECT_ID: ""
  FIREBASE_CLIENT_EMAIL: ""
  FIREBASE_PRIVATE_KEY: ""

  # ── AI Coach (optional) ───────────────────────────────────────────────────
  AI_API_KEY: ""
