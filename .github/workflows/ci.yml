# ============================================================================
#  CI — runs on every PR and push to main/develop.
#  Backend: lint → prisma generate → unit + e2e tests (with pg+redis) → build.
#  Mobile:  flutter analyze.
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────── Backend ─────────────────────────────────
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    # Service containers for tests that hit a real DB / Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifequest
          POSTGRES_PASSWORD: lifequest
          POSTGRES_DB: lifequest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lifequest -d lifequest_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://lifequest:lifequest@localhost:5432/lifequest_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --ci --runInBand

      - name: Build
        run: npm run build

  # ─────────────────────────── Docker build (smoke) ────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: lifequest/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────── Mobile ──────────────────────────────────
  mobile:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Skip gracefully until the Flutter project is scaffolded.
      - name: Check for pubspec
        id: pubspec
        run: |
          if [ -f pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml yet — skipping Flutter analyze."
          fi

      - name: Setup Flutter
        if: steps.pubspec.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        if: steps.pubspec.outputs.exists == 'true'
        run: flutter pub get

      # Generate Freezed / json_serializable sources (*.freezed.dart, *.g.dart)
      # which are git-ignored, so `analyze` sees the real generated types.
      - name: Code generation
        if: steps.pubspec.outputs.exists == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      # Fail only on errors; style infos/warnings are reported but non-blocking.
      - name: Analyze
        if: steps.pubspec.outputs.exists == 'true'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        if: steps.pubspec.outputs.exists == 'true' && hashFiles('mobile/test/**/*.dart') != ''
        run: flutter test
